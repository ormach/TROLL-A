    <!-- GAME -->
    <div id="screen">
        <!-- Pile Dice -->      
        <div id="dice"></div>

        <!-- Ui -->
        <div class="uiElements">
            
            <div class="stat">
                <img src="./img/ico/life.png">
                <p id="lifeUi">20</p>
            </div>
            
            <div class="stat">
                <img src="./img/ico/floor.png">
                <p id="floorUi"></p>
            </div>

            <div class="stat">
                <img src="./img/ico/coin.png">
                <p id="coinsUi">0</p>
            </div>
        </div>

        <!-- Cards -->
         <div id="cardContainer">
             <div id="cardImg" class="card"></div>
             <div id="cardContent" class="card"></div>
         </div>
        
        <div id="itemContainer">
            <img id="how" src="./img/ico/die-info.png" alt="">
            <div id="items"></div>
        </div>

    </div>
